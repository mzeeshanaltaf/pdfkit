services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: runtime
    ports:
      - "8000:8000"
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
    tmpfs:
      # A tmpfs mount masks whatever ownership the image gave this path, so it
      # has to be handed to the non-root `pdfkit` user (uid 1001) explicitly —
      # otherwise it arrives root-owned and every upload fails to write.
      - /tmp/pdfkit:uid=1001,gid=1001,mode=0700
    restart: unless-stopped

  # Test-only image: the same base plus dev dependencies and the suite, which
  # the runtime target deliberately does not carry.
  #   docker compose run --rm backend-tests
  backend-tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      WORK_DIR: /tmp/pdfkit
    tmpfs:
      - /tmp/pdfkit
