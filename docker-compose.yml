services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        # Self-hosted Umami. Optional: unset, layout.tsx renders no tracker at all.
        NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${NEXT_PUBLIC_UMAMI_SCRIPT_URL:-}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
    # No host port publish here: Coolify's Traefik reaches this over the
    # internal Docker network via its own labels. Host-published ports would
    # collide with whatever else already holds that port on a shared VPS (see
    # the backend service below, which is the one that actually collided).
    # docker-compose.override.yml adds the :3000 host mapping back for local dev.
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      # Contact form. Read at request time in the route handler, so these are runtime
      # env — not build args — and must never be NEXT_PUBLIC_.
      N8N_CONTACT_WEBHOOK_URL: ${N8N_CONTACT_WEBHOOK_URL:-}
      N8N_API_KEY: ${N8N_API_KEY:-}
      # Optional: unset, the rate limiter fails open and the form still works.
      # Also used by /api/token, which fails open the same way.
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      # The same secret the backend verifies with. /api/token reads it at request
      # time, so it is runtime env, never a build arg and never NEXT_PUBLIC_ —
      # which also means rotating it needs no frontend rebuild.
      API_TOKEN_SECRET: ${API_TOKEN_SECRET:-}
      # Admin dashboard (/admin) — a private, password-gated view of anonymous per-run
      # counters. Unset DATABASE_URL and the feature degrades quietly: ingest is a no-op,
      # the dashboard shows a "not configured" panel. All runtime env, read per request.
      DATABASE_URL: ${DATABASE_URL:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      # Salts the daily-rotating visitor hash stats rows carry instead of an IP address.
      STATS_SALT: ${STATS_SALT:-}
      STATS_RETENTION_DAYS: ${STATS_RETENTION_DAYS:-365}
      # Shared with the backend's STATS_INGEST_SECRET above: authenticates the
      # backend's sandbox-telemetry POSTs to this service's own /api/stats/sandbox.
      STATS_INGEST_SECRET: ${STATS_INGEST_SECRET:-}
      # Read-only Daytona API access for the admin dashboard's "live now" quota
      # strip (GET /organizations/{id}/usage) — the same account and key the
      # backend's DAYTONA_API_KEY names, reused here for a different call.
      DAYTONA_API_KEY: ${DAYTONA_API_KEY:-}
      DAYTONA_API_URL: ${DAYTONA_API_URL:-https://app.daytona.io/api}
      # Overrides Daytona's published per-second rates the cost estimate is
      # built from (frontend/lib/stats/daytona-pricing.ts). Unset, the built-in
      # defaults apply — only needed if Daytona's pricing changes.
      DAYTONA_PRICE_CPU_HOUR: ${DAYTONA_PRICE_CPU_HOUR:-}
      DAYTONA_PRICE_RAM_GB_HOUR: ${DAYTONA_PRICE_RAM_GB_HOUR:-}
      DAYTONA_PRICE_DISK_GB_HOUR: ${DAYTONA_PRICE_DISK_GB_HOUR:-}
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: runtime
    # Publishing 8000 on the host collided with Coolify's own dashboard/API,
    # which already binds host port 8000 (deploy failure: "port is already
    # allocated"). Traefik reaches this container over the internal network
    # instead. docker-compose.override.yml adds the :8000 host mapping for
    # local dev.
    expose:
      - "8000"
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
      # Same value as the frontend's. Unset, the API accepts unauthenticated
      # requests and says so loudly at startup and on /health.
      API_TOKEN_SECRET: ${API_TOKEN_SECRET:-}
      # Verify-only, so the secret above can be rotated without cutting off the
      # tokens already in flight.
      API_TOKEN_SECRET_PREVIOUS: ${API_TOKEN_SECRET_PREVIOUS:-}
      # THE variable behind per-IP rate limiting. uvicorn reads this itself, and
      # its default is 127.0.0.1 — Traefik reaches this container from a Docker
      # bridge address, so without these ranges trusted, request.client.host is
      # *Traefik* for every visitor and the entire site shares one bucket.
      # Safe to be this broad because the service uses `expose`, not `ports`: it
      # is only reachable through the proxy on the internal network.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.16.0.0/12,10.0.0.0/8}
      # Daytona offload. Off unless DAYTONA_ENABLED is true, in which case the
      # CPU-heavy operations run in a per-request sandbox instead of on this
      # box. Everything here is inert while it is false, so an unset key is
      # not a misconfiguration - it is the default posture.
      DAYTONA_ENABLED: ${DAYTONA_ENABLED:-false}
      DAYTONA_API_KEY: ${DAYTONA_API_KEY:-}
      DAYTONA_API_URL: ${DAYTONA_API_URL:-https://app.daytona.io/api}
      DAYTONA_TARGET: ${DAYTONA_TARGET:-eu}
      # Content-hashed and built by .github/workflows/snapshot.yml; set by
      # hand from that run's summary, never automatically. See .env.example.
      DAYTONA_SNAPSHOT: ${DAYTONA_SNAPSHOT:-pdfkit-toolchain}
      DAYTONA_OPERATIONS: ${DAYTONA_OPERATIONS:-ocr,word,markdown,compress}
      DAYTONA_MAX_SANDBOXES: ${DAYTONA_MAX_SANDBOXES:-2}
      DAYTONA_SANDBOX_CPU: ${DAYTONA_SANDBOX_CPU:-4}
      DAYTONA_SANDBOX_MEMORY_GB: ${DAYTONA_SANDBOX_MEMORY_GB:-4}
      DAYTONA_SANDBOX_DISK_GB: ${DAYTONA_SANDBOX_DISK_GB:-10}
      DAYTONA_MIN_FILES: ${DAYTONA_MIN_FILES:-2}
      DAYTONA_MIN_BYTES: ${DAYTONA_MIN_BYTES:-5242880}
      DAYTONA_PROVISION_TIMEOUT_SECONDS: ${DAYTONA_PROVISION_TIMEOUT_SECONDS:-150}
      DAYTONA_OVERHEAD_SECONDS: ${DAYTONA_OVERHEAD_SECONDS:-90}
      DAYTONA_AUTO_STOP_MINUTES: ${DAYTONA_AUTO_STOP_MINUTES:-5}
      DAYTONA_TTL_MINUTES: ${DAYTONA_TTL_MINUTES:-30}
      DAYTONA_FALLBACK_LOCAL: ${DAYTONA_FALLBACK_LOCAL:-true}
      # Sandbox telemetry: one record per shard, posted to the frontend service
      # over the internal Docker network so the admin dashboard can report
      # Daytona's own cost without depending on its Spending dashboard (which
      # lags real consumption by up to 48 hours). Off unless both are set.
      STATS_INGEST_URL: ${STATS_INGEST_URL:-http://frontend:3000/api/stats/sandbox}
      STATS_INGEST_SECRET: ${STATS_INGEST_SECRET:-}
    tmpfs:
      # A tmpfs mount masks whatever ownership the image gave this path, so it
      # has to be handed to the non-root `pdfkit` user (uid 1001) explicitly —
      # otherwise it arrives root-owned and every upload fails to write.
      - /tmp/pdfkit:uid=1001,gid=1001,mode=0700
    restart: unless-stopped

  # Test-only image: the same base plus dev dependencies and the suite, which
  # the runtime target deliberately does not carry.
  #   docker compose run --rm backend-tests
  backend-tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      WORK_DIR: /tmp/pdfkit
    tmpfs:
      - /tmp/pdfkit
