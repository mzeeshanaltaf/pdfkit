[project]
name = "pdfkit-backend"
version = "0.1.0"
description = "FastAPI backend for PDFKit — compress, OCR, protect, unlock and image extraction."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",
    "ocrmypdf>=16.6",
    "pillow>=11.0",
    "pypdf>=5.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
