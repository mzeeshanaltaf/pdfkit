[project]
name = "pdfkit-backend"
version = "0.1.0"
description = "FastAPI backend for PDFKit — compress, OCR, protect, unlock, image extraction and document conversion."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",
    "ocrmypdf>=16.6",
    "pillow>=11.0",
    "pypdf>=5.1",
    # Font subsetting for Compress. Word embeds whole fonts — a document with one
    # emoji in it carries all 7.7 MB of Segoe UI Emoji — and Ghostscript's own
    # subsetter does not understand the colour tables that make up the bulk.
    "fonttools>=4.55",
    # PDF → Markdown. Converts locally; the hosted-OCR path is never used.
    "firecrawl-anydoc>=0.2.4",
    # PDF → Word. Driven from `app/tools/pdf2docx_cli.py` in a subprocess of its
    # own — never imported into the server — so its AGPL PyMuPDF engine stays a
    # separate process, the same posture the image already has with Ghostscript.
    # That shim exists because the stock library drops inter-word spaces; see it.
    "pdf2docx>=0.5.13",
    # Daytona offload (app/services/offload.py). Pinned rather than floated:
    # this phase verified the two API shapes it depends on against exactly this
    # release - session exec with run_async returning a command id, and
    # get_session_command_logs_async delivering stdout and stderr as separate
    # incremental callbacks. Neither is guaranteed by semver.
    "daytona==0.214.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
